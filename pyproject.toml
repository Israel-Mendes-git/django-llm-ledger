[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-llm-ledger"
version = "0.1.0"
description = "Cost tracking, provider fallback and evaluation suites for LLM features in Django apps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Israel Mendes" }]
keywords = ["django", "llm", "openai", "anthropic", "ollama", "cost", "observability", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "Django>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "PyYAML>=6.0",
]

[project.urls]
Source = "https://github.com/Israel-Mendes-git/django-llm-ledger"
Changelog = "https://github.com/Israel-Mendes-git/django-llm-ledger/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src/llm_ledger", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_ledger"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
